apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-cicd-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-cicd
  template:
    metadata:
      labels:
        app: cloud-cicd
    spec:
      containers:
        - name: cloud-cicd-app
          image: sohamccd/cloud-cicd-lab:latest
          ports:
            - containerPort: 5000

